server.port=8081
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:loxecutivo}?useTimezone=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:loxecutivo}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.main.banner-mode=console
spring.application.name=loxecutivo
auth.service.url=${AUTH_SERVICE_URL:http://127.0.0.1:8082/validar}
